<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historial - Depósito Gilera</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; color: #333; display: flex; flex-direction: column; min-height: 100vh; }
    
    /* Header Responsive */
    header { background-color: #0f172a; color: #fff; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex-wrap: wrap; gap: 1rem; }
    header h1 { font-size: 1.4rem; font-weight: 600; }
    nav a { background: transparent; border: 1px solid #38bdf8; color: #38bdf8; padding: 0.5rem 1rem; border-radius: 6px; text-decoration: none; font-weight: 600; transition: all 0.2s ease; display: inline-block; }
    nav a:hover { background-color: #38bdf8; color: #0f172a; }
    
    main { flex: 1; max-width: 1200px; width: 100%; margin: 2rem auto; padding: 0 1rem; }
    
    .card { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    .header-card { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.5rem; flex-wrap: wrap; gap: 1rem; }
    .section-title { color: #0f172a; margin: 0; border: none; padding: 0; font-size: 1.5rem; }
    
    /* Estilos para el buscador */
    .search-container { flex: 1; min-width: 250px; display: flex; justify-content: flex-end; }
    .search-container input { padding: 0.5rem 1rem; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; width: 100%; max-width: 350px; transition: border-color 0.2s; }
    .search-container input:focus { border-color: #38bdf8; }

    /* Tabla Responsive con Scroll Interno y Encabezado Fijo */
    .table-responsive { 
      width: 100%; 
      max-height: 60vh; 
      overflow-x: auto; 
      overflow-y: auto; 
      -webkit-overflow-scrolling: touch; 
      border-radius: 6px;
      border: 1px solid #e2e8f0;
    }
    
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; min-width: 700px; /* Asegura que la tabla no se aplaste en celulares */ }
    th, td { padding: 0.75rem 0.6rem; border-bottom: 1px solid #e2e8f0; white-space: nowrap; }
    
    th { 
      background-color: #f8fafc; 
      color: #475569; 
      font-weight: 600; 
      position: sticky; 
      top: 0; 
      z-index: 10; 
      box-shadow: 0 2px 2px -1px rgba(0, 0, 0, 0.1); 
    }
    
    tr:hover { background-color: #f1f5f9; }


    /* Ajustes para Celulares (menor a 768px) */
    @media (max-width: 768px) {
      header { flex-direction: column; text-align: center; }
      .header-card { flex-direction: column; align-items: stretch; }
      .search-container { justify-content: stretch; }
      .search-container input { max-width: 100%; }
      .card { padding: 1rem; margin-top: 1rem; }
    }
    
    /* =========================================
       REGLAS DEL MODO OSCURO (Para todas las páginas)
       ========================================= */
    body.dark-mode { background-color: #0f172a; color: #f8fafc; }
    body.dark-mode .card { background-color: #1e293b; box-shadow: none; border: 1px solid #334155; }
    body.dark-mode .section-title { color: #f8fafc; border-bottom: 2px solid #334155; }
    body.dark-mode th { background-color: #0f172a; color: #94a3b8; }
    body.dark-mode td { border-bottom: 1px solid #334155; }
    body.dark-mode tr:hover { background-color: #334155; }
    body.dark-mode input, body.dark-mode select { background-color: #0f172a; color: #f8fafc; border-color: #475569; }
    body.dark-mode input::placeholder { color: #64748b; }
    body.dark-mode label { color: #cbd5e1; }
    /* Borde oscuro para la caja con scroll */
    body.dark-mode .table-responsive { border-color: #334155; }
  </style>
</head>
<body>

  <script>
    // esto es para que lea el modo oscuro antes de ejecutar el codigo, antes daba un error tipo destello cuando cambiabas entre paginas
    if (localStorage.getItem('modo_oscuro') === 'true') {
      document.body.classList.add('dark-mode');
    }
  </script>

  <header>
    <h1 style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center;">
      <!-- Contenedor fantasma flexible -->
      <div style="width: 80px; height: 40px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <img src="logo.png" alt="Logo Gilera" style="max-height: 100%; max-width: 100%; object-fit: contain;"> 
      </div>
      Depósito Gilera
    </h1>
    <nav>
      <a href="index.html">🏠 Menú Principal</a>
    </nav>
  </header>

  <main>
    <section class="card">
      
      <div class="header-card">
        <h2 class="section-title">Historial de Movimientos</h2>
        <div class="search-container">
          <!-- Llamamos a la función filtrarHistorial() al soltar una tecla -->
          <input type="text" id="input-busqueda-historial" placeholder="🔍 Buscar por modelo, orden, fecha..." onkeyup="filtrarHistorial()">
        </div>
      </div>

      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Fecha y Hora</th>
              <th>Modelo</th>
              <th>Orden</th>
              <th>Factura</th>
              <th>Cantidad</th>
              <th>Destino</th>
            </tr>
          </thead>
          <tbody id="tabla-historial">
            <!-- Dinámico por JS -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
