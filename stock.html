<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario - Depósito Gilera</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; color: #333; display: flex; flex-direction: column; min-height: 100vh; }
    
    /* Header Responsive */
    header { background-color: #0f172a; color: #fff; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex-wrap: wrap; gap: 1rem; }
    header h1 { font-size: 1.4rem; font-weight: 600; }
    nav { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    nav a { background: transparent; border: 1px solid #38bdf8; color: #38bdf8; padding: 0.5rem 1rem; border-radius: 6px; text-decoration: none; font-weight: 600; transition: all 0.2s ease; display: inline-block; text-align: center; }
    nav a:hover { background-color: #38bdf8; color: #0f172a; }
    
    main { flex: 1; max-width: 1200px; width: 100%; margin: 2rem auto; padding: 0 1rem; }
    .card { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); margin-bottom: 2rem; }
    .section-title { margin-bottom: 1.5rem; color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.5rem; font-size: 1.5rem;}
    
    /* FORMULARIO DE EDICIÓN */
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.2rem; margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.4rem; font-weight: 600; font-size: 0.9rem; color: #475569; }
    .form-group input { width: 100%; padding: 0.65rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
    .form-group input:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); }
    .btn-submit { width: 100%; background-color: #0284c7; color: white; border: none; padding: 0.75rem; font-size: 1rem; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.2s; margin-bottom: 0.5rem; }
    .btn-submit:hover { background-color: #0369a1; }
    .btn-cancel { width: 100%; background-color: #64748b; color: white; border: none; padding: 0.75rem; font-size: 1rem; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
    .btn-cancel:hover { background-color: #475569; }

    /* TABLA Y BUSCADOR */
    .search-bar { margin-bottom: 1.5rem; }
    .search-bar input { width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; transition: border-color 0.2s; }
    .search-bar input:focus { border-color: #38bdf8; outline: none; }
    
   .table-responsive { 
      width: 100%; 
      max-height: 60vh; /* La tabla ocupará como máximo el 60% de la pantalla */
      overflow-x: auto; 
      overflow-y: auto; /* Activa el scroll vertical */
      -webkit-overflow-scrolling: touch; 
      border-radius: 6px;
      border: 1px solid #e2e8f0; /* Le da un marquito sutil */
    }
    th, td { padding: 0.75rem 0.6rem; border-bottom: 1px solid #e2e8f0; white-space: nowrap; }
    th { 
      background-color: #f8fafc; 
      color: #475569; 
      font-weight: 600; 
      position: sticky; /* ¡La magia! Hace que el título se quede pegado */
      top: 0; /* Lo pega al techo de la tabla */
      z-index: 10; /* Evita que los datos de abajo se superpongan */
      box-shadow: 0 2px 2px -1px rgba(0, 0, 0, 0.1); /* Le da una sombrita para separarlo de los datos */
    }
    tr:hover { background-color: #f1f5f9; }
    
    /* Botones de acción en la tabla */
    .btn-edit { background-color: #eab308; color: white; border: none; padding: 0.3rem 0.6rem; border-radius: 4px; cursor: pointer; font-weight: 600; }
    .btn-edit:hover { background-color: #ca8a04; }
    .btn-delete { background-color: #ef4444; color: white; border: none; padding: 0.3rem 0.6rem; border-radius: 4px; cursor: pointer; font-weight: 600; }
    .btn-delete:hover { background-color: #dc2626; }
    
    .hidden { display: none !important; }

    /* Ajustes para Celulares */
    @media (max-width: 768px) {
      header { flex-direction: column; text-align: center; }
      nav { width: 100%; justify-content: center; }
      nav a { flex: 1; } /* Los botones del menú ocupan todo el ancho disponible */
      .card { padding: 1rem; margin-top: 1rem; }
      main { margin: 1rem auto; }
    }
    /* =========================================
       REGLAS DEL MODO OSCURO (Para todas las páginas)
       ========================================= */
    body.dark-mode { background-color: #0f172a; color: #f8fafc; }
    body.dark-mode .card { background-color: #1e293b; box-shadow: none; border: 1px solid #334155; }
    body.dark-mode .section-title { color: #f8fafc; border-bottom: 2px solid #334155; }
    body.dark-mode th { background-color: #0f172a; color: #94a3b8; }
    body.dark-mode td { border-bottom: 1px solid #334155; }
    body.dark-mode tr:hover { background-color: #334155; }
    body.dark-mode input, body.dark-mode select { background-color: #0f172a; color: #f8fafc; border-color: #475569; }
    body.dark-mode input::placeholder { color: #64748b; }
    body.dark-mode label { color: #cbd5e1; }
    body.dark-mode .table-responsive { border-color: #334155; }
  </style>
</head>
<body>

  <script>
    // esto es para que lea el modo oscuro antes de ejecutar el codigo, antes daba un errror tipo destello cuando cambiabas entre paginas
    if (localStorage.getItem('modo_oscuro') === 'true') {
      document.body.classList.add('dark-mode');
    }
  </script>

  <header>
    <h1 style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center;">
      <!-- Contenedor fantasma flexible -->
      <div style="width: 80px; height: 40px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <img src="logo.png" alt="Logo Gilera" style="max-height: 100%; max-width: 100%; object-fit: contain;"> 
      </div>
      Depósito Gilera
    </h1>
    <nav>
      <a href="agregar.html">+ Agregar</a>
      <a href="index.html">🏠 Menú</a>
    </nav>
  </header>

  <main>
    <!-- VISTA 1: FORMULARIO DE EDICIÓN (Oculto por defecto hasta que das editar) -->
    <section id="sec-edicion" class="card hidden">
      <h2 class="section-title">Editar Registro</h2>
      <form id="form-editar" onsubmit="actualizarProducto(event)">
        <input type="hidden" id="edit-index">
        <div class="form-grid">
          <div class="form-group">
            <label for="edit-orden">Orden:</label>
            <input type="text" id="edit-orden" required>
          </div>
          <div class="form-group">
            <label for="edit-factura">Factura:</label>
            <input type="text" id="edit-factura" required>
          </div>
          <div class="form-group">
            <label for="edit-contenedor">Contenedor:</label>
            <input type="text" id="edit-contenedor" required>
          </div>
          <div class="form-group">
            <label for="edit-cantidad_ikd">Cantidad de IKD:</label>
            <input type="number" id="edit-cantidad_ikd" min="0" required>
          </div>
          <div class="form-group">
            <label for="edit-modelo">Modelo:</label>
            <input type="text" id="edit-modelo" required>
          </div>
          <div class="form-group">
            <label for="edit-bl_no">B/L NO.:</label>
            <input type="text" id="edit-bl_no" required>
          </div>
          <div class="form-group">
            <label for="edit-buque">Buque:</label>
            <input type="text" id="edit-buque" required>
          </div>
          <div class="form-group">
            <label for="edit-fecha_descarga">Fecha de Descarga:</label>
            <input type="date" id="edit-fecha_descarga" required>
          </div>
          <div class="form-group">
            <label for="edit-deposito">Depósito:</label>
            <input type="text" id="edit-deposito" required>
          </div>
          <div class="form-group">
            <label for="edit-posicion">Posición:</label>
            <input type="text" id="edit-posicion" required>
          </div>
        </div>
        <button type="submit" class="btn-submit">Guardar Cambios</button>
        <button type="button" class="btn-cancel" onclick="ocultarEdicion()">Cancelar</button>
      </form>
    </section>

    <!-- VISTA 2: TABLA DE INVENTARIO -->
    <section id="sec-inventario" class="card">
      <h2 class="section-title">Inventario Registrado (Stock Actual)</h2>
      
      <div class="search-bar">
        <input type="text" id="input-busqueda" onkeyup="filtrarTabla()" placeholder="🔍 Buscar por Orden, Factura, Contenedor, B/L, Modelo, Depósito...">
      </div>

      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Orden</th>
              <th>Factura</th>
              <th>Contenedor</th>
              <th>Cant. IKD</th>
              <th>Modelo</th>
              <th>B/L NO.</th>
              <th>Buque</th>
              <th>F. Descarga</th>
              <th>Depósito</th>
              <th>Posición</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-body">
            <!-- Dinámico por JS -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
